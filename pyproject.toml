[project]
name = "postgres-graph-rag"
version = "0.1.0"
description = "A lean GraphRAG library using Postgres/pgvector as the sole database"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ayush Mishra" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "psycopg[binary,pool]>=3.1.18",
    "pgvector>=0.2.5",
    "openai>=1.12.0",
    "google-genai>=0.1.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
]
dev = [
    "postgres-graph-rag[test,mcp]",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "coverage>=7.6.0",
]
build = [
    "hatchling>=1.25.0",
    "build>=1.2.0",
]
mcp = [
    "mcp>=2,<3",
]

[project.urls]
Homepage = "https://github.com/ayushmishra/postgres-graph-rag"
Repository = "https://github.com/ayushmishra/postgres-graph-rag"

[project.scripts]
postgres-graph-rag-mcp = "postgres_graph_rag.mcp_server:main"
postgres-graph-rag-demo = "postgres_graph_rag.demo:main"
postgres-graph-rag-eval = "postgres_graph_rag.evaluation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["postgres_graph_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
