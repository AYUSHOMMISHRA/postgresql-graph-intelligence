name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-n-publish:
    name: Build and publish Python distributions to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false # cache disabled to avoid errors

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra test --extra mcp

      - name: Run tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check postgres_graph_rag tests benchmarks

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
